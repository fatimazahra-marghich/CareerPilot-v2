stages:
  - test
  - build
  - deploy

# Variables lues par backend_config/settings.py (DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT)
# Le service postgres lit POSTGRES_*. Les deux doivent rester cohérents.
variables:
  POSTGRES_DB: PFAdb_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: admin
  DB_NAME: PFAdb_test
  DB_USER: postgres
  DB_PASSWORD: admin
  DB_HOST: postgres
  DB_PORT: "5432"
  GROQ_API_KEY: "test-key"
  GROQ_MODEL: "openai/gpt-oss-120b"
  SECRET_KEY: "test-secret-key-for-ci"
  DEBUG: "True"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# Lance le pipeline sur les merge requests et sur les branches test / main
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/npm

# ─── STAGE 1 : TESTS ──────────────────────────────────────────────
test_backend:
  stage: test
  image: python:3.10-slim
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev libxml2-dev libxslt-dev
    - pip install -r requirements.txt
    - pip install coverage
  script:
    - coverage run --source=. manage.py test --verbosity=2
    - coverage report
    - coverage xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_frontend:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  script:
    # Le lint remonte des erreurs existantes dans le code (no-unused-vars, no-empty...).
    # Non bloquant tant qu'elles ne sont pas corrigées, puis retirer allow_failure.
    - npm run lint || echo "Lint en échec (non bloquant)"
    - npm run build
  variables:
    VITE_API_URL: "http://localhost:8000"

# ─── STAGE 2 : BUILD DOCKER ───────────────────────────────────────
.docker_build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main"

build_backend:
  extends: .docker_build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/backend:latest .
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest

build_frontend:
  extends: .docker_build
  script:
    # VITE_API_URL est figée au build : mets l'URL publique de ton API pour la prod
    - docker build
        --build-arg VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
        -t $CI_REGISTRY_IMAGE/frontend:latest
        ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest

# ─── STAGE 3 : DEPLOY ─────────────────────────────────────────────
# Variables à créer dans GitLab > Settings > CI/CD > Variables :
#   SSH_PRIVATE_KEY, SSH_USER, SSH_HOST
# Le fichier .env (non versionné) doit déjà exister dans /app/CareerPilot-v2 sur le serveur.
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Déploiement sur le serveur..."
    - ssh "$SSH_USER@$SSH_HOST" "
        cd /app/CareerPilot-v2 &&
        git pull origin main &&
        docker compose up --build -d
      "
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual